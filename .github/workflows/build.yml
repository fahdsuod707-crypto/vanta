name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/vanta/cam app/src/main/res/values app/src/main/res/layout
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VantaCam"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.vanta.cam"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.vanta.cam"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              val camerax = "1.3.4"
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.camera:camera-core:$camerax")
              implementation("androidx.camera:camera-camera2:$camerax")
              implementation("androidx.camera:camera-lifecycle:$camerax")
              implementation("androidx.camera:camera-video:$camerax")
              implementation("androidx.camera:camera-view:$camerax")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.camera.any" android:required="true"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.VantaCam"
                  android:supportsRtl="true">
                  <activity
                      android:name=".CameraActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">VantaCam</string>
          </resources>
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.VantaCam" parent="Theme.Material3.Dark.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowBackground">#000000</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/res/layout/activity_camera.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">
              <androidx.camera.view.PreviewView
                  android:id="@+id/preview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"/>
              <ImageButton
                  android:id="@+id/flash"
                  android:layout_width="48dp"
                  android:layout_height="48dp"
                  android:layout_gravity="top|end"
                  android:layout_margin="16dp"
                  android:background="@android:color/transparent"
                  android:src="@android:drawable/ic_menu_camera"/>
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom"
                  android:orientation="vertical"
                  android:padding="16dp">
                  <TextView
                      android:id="@+id/mode"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="center_horizontal"
                      android:padding="8dp"
                      android:text="PHOTO"
                      android:textColor="#FFFFFF"
                      android:textSize="16sp"/>
                  <HorizontalScrollView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp">
                      <LinearLayout
                          android:id="@+id/zoomBar"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_gravity="center_horizontal"
                          android:orientation="horizontal"/>
                  </HorizontalScrollView>
                  <ImageButton
                      android:id="@+id/shutter"
                      android:layout_width="72dp"
                      android:layout_height="72dp"
                      android:layout_gravity="center_horizontal"
                      android:layout_marginTop="16dp"
                      android:background="@android:drawable/ic_menu_camera"/>
              </LinearLayout>
          </FrameLayout>
          EOF
          cat > app/src/main/java/com/vanta/cam/CameraActivity.kt <<'EOF'
          package com.vanta.cam

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.ContentValues
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.MotionEvent
          import android.widget.ImageButton
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.FocusMeteringAction
          import androidx.camera.core.ImageCapture
          import androidx.camera.core.ImageCaptureException
          import androidx.camera.core.Preview
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.video.MediaStoreOutputOptions
          import androidx.camera.video.Quality
          import androidx.camera.video.QualitySelector
          import androidx.camera.video.Recorder
          import androidx.camera.video.Recording
          import androidx.camera.video.VideoCapture
          import androidx.camera.video.VideoRecordEvent
          import androidx.camera.view.PreviewView
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.text.SimpleDateFormat
          import java.util.Locale

          class CameraActivity : AppCompatActivity() {

              private lateinit var previewView: PreviewView
              private lateinit var zoomBar: LinearLayout
              private lateinit var shutter: ImageButton
              private lateinit var flashBtn: ImageButton
              private lateinit var modeText: TextView

              private var imageCapture: ImageCapture? = null
              private var videoCapture: VideoCapture<Recorder>? = null
              private var recording: Recording? = null
              private var camera: Camera? = null
              private var isVideo = false
              private var flashOn = false

              private val REQ = 10

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_camera)

                  previewView = findViewById(R.id.preview)
                  zoomBar = findViewById(R.id.zoomBar)
                  shutter = findViewById(R.id.shutter)
                  flashBtn = findViewById(R.id.flash)
                  modeText = findViewById(R.id.mode)

                  if (hasPerms()) startCamera() else ActivityCompat.requestPermissions(
                      this, arrayOf(Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO), REQ)

                  shutter.setOnClickListener { if (isVideo) toggleRecording() else takePhoto() }
                  flashBtn.setOnClickListener { toggleFlash() }
                  modeText.setOnClickListener {
                      isVideo = !isVideo
                      modeText.text = if (isVideo) "VIDEO" else "PHOTO"
                  }
                  previewView.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_UP) focus(e.x, e.y)
                      true
                  }
              }

              private fun hasPerms() =
                  ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED

              override fun onRequestPermissionsResult(r: Int, p: Array<out String>, g: IntArray) {
                  super.onRequestPermissionsResult(r, p, g)
                  if (r == REQ && g.isNotEmpty() && g[0] == PackageManager.PERMISSION_GRANTED) startCamera()
              }

              private fun startCamera() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      val provider = future.get()
                      val preview = Preview.Builder().build().also {
                          it.setSurfaceProvider(previewView.surfaceProvider)
                      }
                      imageCapture = ImageCapture.Builder()
                          .setCaptureMode(ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY).build()
                      val recorder = Recorder.Builder()
                          .setQualitySelector(QualitySelector.from(Quality.HD)).build()
                      videoCapture = VideoCapture.withOutput(recorder)

                      provider.unbindAll()
                      camera = provider.bindToLifecycle(
                          this, CameraSelector.DEFAULT_BACK_CAMERA, preview, imageCapture, videoCapture)
                      buildZoomPresets()
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun buildZoomPresets() {
                  val info = camera?.cameraInfo ?: return
                  val min = info.zoomState.value?.minZoomRatio ?: 1f
                  val max = info.zoomState.value?.maxZoomRatio ?: 1f
                  val presets = listOf(0.6f, 1f, 2f, 3f, 5f, 10f).filter { it in min..max }
                  zoomBar.removeAllViews()
                  for (z in presets) {
                      val b = TextView(this)
                      b.text = if (z < 1f) "${z}x" else "${z.toInt()}x"
                      b.setPadding(28, 14, 28, 14)
                      b.setTextColor(0xFFFFFFFF.toInt())
                      b.setOnClickListener { camera?.cameraControl?.setZoomRatio(z) }
                      zoomBar.addView(b)
                  }
              }

              private fun focus(x: Float, y: Float) {
                  val c = camera ?: return
                  val point = previewView.meteringPointFactory.createPoint(x, y)
                  c.cameraControl.startFocusAndMetering(FocusMeteringAction.Builder(point).build())
              }

              private fun toggleFlash() {
                  flashOn = !flashOn
                  camera?.cameraControl?.enableTorch(flashOn)
                  flashBtn.alpha = if (flashOn) 1f else 0.5f
              }

              private fun takePhoto() {
                  val ic = imageCapture ?: return
                  val name = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(System.currentTimeMillis())
                  val values = ContentValues().apply {
                      put(MediaStore.Images.Media.DISPLAY_NAME, "VANTA_$name.jpg")
                      put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                  }
                  val opts = ImageCapture.OutputFileOptions.Builder(
                      contentResolver, MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values).build()
                  ic.takePicture(opts, ContextCompat.getMainExecutor(this),
                      object : ImageCapture.OnImageSavedCallback {
                          override fun onImageSaved(o: ImageCapture.OutputFileResults) { toast("Saved") }
                          override fun onError(e: ImageCaptureException) { toast("Error: ${e.message}") }
                      })
              }

              @SuppressLint("MissingPermission")
              private fun toggleRecording() {
                  val vc = videoCapture ?: return
                  if (recording != null) {
                      recording?.stop(); recording = null; toast("Stopped"); return
                  }
                  val name = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(System.currentTimeMillis())
                  val values = ContentValues().apply {
                      put(MediaStore.Video.Media.DISPLAY_NAME, "VANTA_$name.mp4")
                      put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                  }
                  val opts = MediaStoreOutputOptions.Builder(
                      contentResolver, MediaStore.Video.Media.EXTERNAL_CONTENT_URI)
                      .setContentValues(values).build()
                  recording = vc.output.prepareRecording(this, opts).withAudioEnabled()
                      .start(ContextCompat.getMainExecutor(this)) { ev ->
                          if (ev is VideoRecordEvent.Finalize) toast("Video saved")
                      }
                  toast("Recording")
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
          }
          EOF

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VantaCam-apk
          path: app/build/outputs/apk/debug/*.apk
