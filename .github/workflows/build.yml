name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3

      - name: Write project
        run: |
          mkdir -p app/src/main/java/com/vanta/cam app/src/main/res/values app/src/main/res/layout app/src/main/res/drawable
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VantaCam"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.vanta.cam"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.vanta.cam"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              val camerax = "1.3.4"
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.camera:camera-core:$camerax")
              implementation("androidx.camera:camera-camera2:$camerax")
              implementation("androidx.camera:camera-lifecycle:$camerax")
              implementation("androidx.camera:camera-video:$camerax")
              implementation("androidx.camera:camera-view:$camerax")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.camera.any" android:required="true"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.VantaCam"
                  android:supportsRtl="true">
                  <activity
                      android:name=".CameraActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">VantaCam</string>
          </resources>
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.VantaCam" parent="Theme.Material3.Dark.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowBackground">#000000</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/res/drawable/bg_pill.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#66000000"/>
              <corners android:radius="24dp"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/shutter_outer.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#00000000"/>
              <stroke android:width="4dp" android:color="#FFFFFF"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/shutter_inner.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#FFFFFF"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/bg_gallery.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#33FFFFFF"/>
              <corners android:radius="8dp"/>
              <stroke android:width="1dp" android:color="#66FFFFFF"/>
          </shape>
          EOF
          cat > app/src/main/res/drawable/bg_zoom_active.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#FFFFFF"/>
          </shape>
          EOF
          cat > app/src/main/res/layout/activity_camera.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <androidx.camera.view.PreviewView
                  android:id="@+id/preview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"/>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="top"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:padding="12dp"
                  android:background="#33000000">

                  <ImageButton
                      android:id="@+id/btnSettings"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="@android:color/transparent"
                      android:src="@android:drawable/ic_menu_preferences"/>

                  <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>

                  <ImageButton
                      android:id="@+id/btnFlash"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="@android:color/transparent"
                      android:src="@android:drawable/ic_menu_camera"/>

                  <ImageButton
                      android:id="@+id/btnTimer"
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:background="@android:color/transparent"
                      android:src="@android:drawable/ic_menu_recent_history"/>
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom"
                  android:orientation="vertical"
                  android:paddingBottom="16dp">

                  <HorizontalScrollView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:scrollbars="none">
                      <LinearLayout
                          android:id="@+id/modeStrip"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_gravity="center_horizontal"
                          android:orientation="horizontal"
                          android:paddingHorizontal="12dp"/>
                  </HorizontalScrollView>

                  <LinearLayout
                      android:id="@+id/zoomPill"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="center_horizontal"
                      android:layout_marginTop="10dp"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:padding="4dp"
                      android:background="@drawable/bg_pill"/>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="18dp"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:paddingHorizontal="28dp">

                      <ImageView
                          android:id="@+id/gallery"
                          android:layout_width="46dp"
                          android:layout_height="46dp"
                          android:background="@drawable/bg_gallery"
                          android:scaleType="centerCrop"/>

                      <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>

                      <FrameLayout
                          android:layout_width="84dp"
                          android:layout_height="84dp"
                          android:background="@drawable/shutter_outer">

                          <ImageButton
                              android:id="@+id/shutter"
                              android:layout_width="66dp"
                              android:layout_height="66dp"
                              android:layout_gravity="center"
                              android:background="@drawable/shutter_inner"
                              android:scaleType="center"/>
                      </FrameLayout>

                      <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1"/>

                      <ImageButton
                          android:id="@+id/flip"
                          android:layout_width="46dp"
                          android:layout_height="46dp"
                          android:background="@android:color/transparent"
                          android:src="@android:drawable/ic_menu_rotate"/>
                  </LinearLayout>
              </LinearLayout>
          </FrameLayout>
          EOF
          cat > app/src/main/java/com/vanta/cam/CameraActivity.kt <<'EOF'
          package com.vanta.cam

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.ContentValues
          import android.content.pm.PackageManager
          import android.content.res.ColorStateList
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.PorterDuff
          import android.graphics.PorterDuffXfermode
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.MotionEvent
          import android.widget.ImageButton
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.FocusMeteringAction
          import androidx.camera.core.ImageCapture
          import androidx.camera.core.ImageProxy
          import androidx.camera.core.Preview
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.video.MediaStoreOutputOptions
          import androidx.camera.video.Quality
          import androidx.camera.video.QualitySelector
          import androidx.camera.video.Recorder
          import androidx.camera.video.Recording
          import androidx.camera.video.VideoCapture
          import androidx.camera.video.VideoRecordEvent
          import androidx.camera.view.PreviewView
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.text.SimpleDateFormat
          import java.util.Locale

          class CameraActivity : AppCompatActivity() {

              private lateinit var previewView: PreviewView
              private lateinit var zoomPill: LinearLayout
              private lateinit var modeStrip: LinearLayout
              private lateinit var shutter: ImageButton
              private lateinit var flashBtn: ImageButton
              private lateinit var flipBtn: ImageButton
              private lateinit var gallery: ImageView

              private var imageCapture: ImageCapture? = null
              private var videoCapture: VideoCapture<Recorder>? = null
              private var recording: Recording? = null
              private var camera: Camera? = null
              private var lensFacing = CameraSelector.LENS_FACING_BACK
              private var currentMode = "صورة"
              private var flashOn = false
              private val REQ = 10
              private val modes = listOf("بورتريه", "صورة", "فيديو", "احترافي", "ليلي", "المزيد")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_camera)

                  previewView = findViewById(R.id.preview)
                  zoomPill = findViewById(R.id.zoomPill)
                  modeStrip = findViewById(R.id.modeStrip)
                  shutter = findViewById(R.id.shutter)
                  flashBtn = findViewById(R.id.btnFlash)
                  flipBtn = findViewById(R.id.flip)
                  gallery = findViewById(R.id.gallery)

                  buildModes()

                  if (hasPerms()) startCamera() else ActivityCompat.requestPermissions(
                      this, arrayOf(Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO), REQ)

                  shutter.setOnClickListener { if (currentMode == "فيديو") toggleRecording() else takePhoto() }
                  flashBtn.setOnClickListener { toggleFlash() }
                  flipBtn.setOnClickListener { switchCamera() }
                  gallery.setOnClickListener { toast("المعرض") }
                  previewView.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_UP) focus(e.x, e.y)
                      true
                  }
              }

              private fun buildModes() {
                  modeStrip.removeAllViews()
                  for (m in modes) {
                      val tv = TextView(this)
                      tv.text = m
                      tv.textSize = 14f
                      tv.setPadding(30, 12, 30, 12)
                      tv.setTextColor(if (m == currentMode) Color.WHITE else Color.parseColor("#99FFFFFF"))
                      tv.setOnClickListener { selectMode(m) }
                      modeStrip.addView(tv)
                  }
              }

              private fun selectMode(m: String) {
                  if (m == "المزيد") { toast("المزيد — قريباً"); return }
                  if (m != "صورة" && m != "فيديو" && m != "بورتريه") { toast("$m — قريباً"); return }
                  currentMode = m
                  buildModes()
                  val tint = if (m == "فيديو") Color.parseColor("#FF3B30") else Color.WHITE
                  shutter.backgroundTintList = ColorStateList.valueOf(tint)
              }

              private fun hasPerms() =
                  ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED

              override fun onRequestPermissionsResult(r: Int, p: Array<out String>, g: IntArray) {
                  super.onRequestPermissionsResult(r, p, g)
                  if (r == REQ && g.isNotEmpty() && g[0] == PackageManager.PERMISSION_GRANTED) startCamera()
              }

              private fun startCamera() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      val provider = future.get()
                      val preview = Preview.Builder().build().also {
                          it.setSurfaceProvider(previewView.surfaceProvider)
                      }
                      imageCapture = ImageCapture.Builder()
                          .setCaptureMode(ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY).build()
                      val recorder = Recorder.Builder()
                          .setQualitySelector(QualitySelector.from(Quality.HD)).build()
                      videoCapture = VideoCapture.withOutput(recorder)

                      val selector = CameraSelector.Builder().requireLensFacing(lensFacing).build()
                      provider.unbindAll()
                      camera = provider.bindToLifecycle(this, selector, preview, imageCapture, videoCapture)
                      buildZoom()
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun switchCamera() {
                  lensFacing = if (lensFacing == CameraSelector.LENS_FACING_BACK)
                      CameraSelector.LENS_FACING_FRONT else CameraSelector.LENS_FACING_BACK
                  startCamera()
              }

              private fun buildZoom() {
                  val info = camera?.cameraInfo ?: return
                  val min = info.zoomState.value?.minZoomRatio ?: 1f
                  val max = info.zoomState.value?.maxZoomRatio ?: 1f
                  val presets = listOf(0.6f, 1f, 2f, 3f, 5f, 10f).filter { it in min..max }
                  zoomPill.removeAllViews()
                  val size = (46 * resources.displayMetrics.density).toInt()
                  for (z in presets) {
                      val tv = TextView(this)
                      tv.text = if (z < 1f) "0.6x" else "${z.toInt()}x"
                      tv.textSize = 13f
                      tv.gravity = Gravity.CENTER
                      tv.layoutParams = LinearLayout.LayoutParams(size, size)
                      tv.setTextColor(Color.parseColor("#CCFFFFFF"))
                      tv.setOnClickListener {
                          camera?.cameraControl?.setZoomRatio(z)
                          highlightZoom(z, presets)
                      }
                      zoomPill.addView(tv)
                  }
                  if (1f in presets) highlightZoom(1f, presets)
              }

              private fun highlightZoom(active: Float, presets: List<Float>) {
                  for (i in 0 until zoomPill.childCount) {
                      val tv = zoomPill.getChildAt(i) as TextView
                      if (presets[i] == active) {
                          tv.setBackgroundResource(R.drawable.bg_zoom_active)
                          tv.setTextColor(Color.BLACK)
                      } else {
                          tv.background = null
                          tv.setTextColor(Color.parseColor("#CCFFFFFF"))
                      }
                  }
              }

              private fun focus(x: Float, y: Float) {
                  val c = camera ?: return
                  val point = previewView.meteringPointFactory.createPoint(x, y)
                  c.cameraControl.startFocusAndMetering(FocusMeteringAction.Builder(point).build())
              }

              private fun toggleFlash() {
                  flashOn = !flashOn
                  camera?.cameraControl?.enableTorch(flashOn)
                  flashBtn.alpha = if (flashOn) 1f else 0.5f
              }

              private fun takePhoto() {
                  val ic = imageCapture ?: return
                  ic.takePicture(ContextCompat.getMainExecutor(this),
                      object : ImageCapture.OnImageCapturedCallback() {
                          override fun onCaptureSuccess(image: ImageProxy) {
                              val rot = image.imageInfo.rotationDegrees
                              var bmp = imageProxyToBitmap(image)
                              image.close()
                              if (bmp == null) { toast("فشل التصوير"); return }
                              bmp = rotateBitmap(bmp, rot)
                              if (currentMode == "بورتريه") bmp = applyPortrait(bmp)
                              saveBitmap(bmp)
                          }
                          override fun onError(exc: androidx.camera.core.ImageCaptureException) {
                              toast("خطأ: ${exc.message}")
                          }
                      })
              }

              private fun imageProxyToBitmap(image: ImageProxy): Bitmap? {
                  return try {
                      val buffer = image.planes[0].buffer
                      val bytes = ByteArray(buffer.remaining())
                      buffer.get(bytes)
                      BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                  } catch (e: Exception) { null }
              }

              private fun rotateBitmap(src: Bitmap, deg: Int): Bitmap {
                  if (deg == 0) return src
                  val m = Matrix(); m.postRotate(deg.toFloat())
                  return Bitmap.createBitmap(src, 0, 0, src.width, src.height, m, true)
              }

              private fun blurBitmap(src: Bitmap): Bitmap {
                  val f = 10
                  val sw = (src.width / f).coerceAtLeast(1)
                  val sh = (src.height / f).coerceAtLeast(1)
                  val small = Bitmap.createScaledBitmap(src, sw, sh, true)
                  return Bitmap.createScaledBitmap(small, src.width, src.height, true)
              }

              private fun applyPortrait(src: Bitmap): Bitmap {
                  val w = src.width
                  val h = src.height
                  val blurred = blurBitmap(src)
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(out)
                  canvas.drawBitmap(blurred, 0f, 0f, null)

                  val cx = w / 2f
                  val cy = h * 0.40f
                  val radius = w * 0.55f
                  val mask = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val mc = Canvas(mask)
                  val p = Paint()
                  p.isAntiAlias = true
                  p.shader = RadialGradient(cx, cy, radius,
                      intArrayOf(0xFF000000.toInt(), 0xFF000000.toInt(), 0x00000000),
                      floatArrayOf(0f, 0.55f, 1f), Shader.TileMode.CLAMP)
                  mc.drawCircle(cx, cy, radius, p)

                  val sharp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val sc = Canvas(sharp)
                  sc.drawBitmap(src, 0f, 0f, null)
                  val xp = Paint()
                  xp.xfermode = PorterDuffXfermode(PorterDuff.Mode.DST_IN)
                  sc.drawBitmap(mask, 0f, 0f, xp)

                  canvas.drawBitmap(sharp, 0f, 0f, null)
                  return out
              }

              private fun saveBitmap(bmp: Bitmap) {
                  val name = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(System.currentTimeMillis())
                  val values = ContentValues().apply {
                      put(MediaStore.Images.Media.DISPLAY_NAME, "VANTA_$name.jpg")
                      put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg")
                  }
                  val uri = contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
                  uri?.let {
                      contentResolver.openOutputStream(it)?.use { os ->
                          bmp.compress(Bitmap.CompressFormat.JPEG, 97, os)
                      }
                  }
                  toast("تم الحفظ")
              }

              @SuppressLint("MissingPermission")
              private fun toggleRecording() {
                  val vc = videoCapture ?: return
                  if (recording != null) {
                      recording?.stop(); recording = null; toast("توقف التسجيل"); return
                  }
                  val name = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(System.currentTimeMillis())
                  val values = ContentValues().apply {
                      put(MediaStore.Video.Media.DISPLAY_NAME, "VANTA_$name.mp4")
                      put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                  }
                  val opts = MediaStoreOutputOptions.Builder(
                      contentResolver, MediaStore.Video.Media.EXTERNAL_CONTENT_URI)
                      .setContentValues(values).build()
                  recording = vc.output.prepareRecording(this, opts).withAudioEnabled()
                      .start(ContextCompat.getMainExecutor(this)) { ev ->
                          if (ev is VideoRecordEvent.Finalize) toast("تم حفظ الفيديو")
                      }
                  toast("يتم التسجيل")
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
          }
          EOF

      - name: Build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VantaCam-apk
          path: app/build/outputs/apk/debug/*.apk
